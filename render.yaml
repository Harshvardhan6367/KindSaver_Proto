# Render Blueprint specification for KindSaver Jaipur
# https://render.com/docs/blueprint-spec

services:
  # 1. Backend API Web Service
  - type: web
    name: kindsaver-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: mongodb
      - key: MONGODB_URI
        sync: false # Set this in the Render dashboard or during Blueprint setup
      - key: MONGODB_DB
        value: kindreport_jaipur
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend React / Vite Static Site
  - type: static
    name: kindsaver-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed backend URL (e.g. https://kindsaver-backend.onrender.com)
